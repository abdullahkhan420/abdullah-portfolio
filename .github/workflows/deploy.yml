
name: Deploy Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract portfolio ZIP
        run: unzip -o Muhammad_Abdullah_AI_ML_Portfolio_React.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: abdullah-ai-portfolio
        run: |
          npm install
          npm run build -- --base=/abdullah-portfolio/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: abdullah-ai-portfolio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
